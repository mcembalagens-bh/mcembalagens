<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carregando... - MC Embalagens BH</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f7fa;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            color: #1a3a5c;
        }
        .loading-box {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e0e0e0;
            border-top: 4px solid #1a3a5c;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 { margin: 0 0 10px; font-size: 20px; }
        p { margin: 0; color: #666; font-size: 14px; }
    </style>
    <script>
        // Executa o redirecionamento imediatamente antes da página aparecer
        (function() {
            var path = window.location.pathname;
            var params = window.location.search; // Pega a parte ?id=2 ou ?produto=123
            
            // Se o usuário não estiver na raiz ou no index.html
            if (path !== "/" && path !== "/index.html" && path !== "") {
                // Manda de volta para a home mantendo o ID. Ex: /?id=2
                window.location.replace("/" + params);
            } else {
                // Fallback de segurança
                window.location.replace("/");
            }
        })();
    </script>
</head>
<body>
    <div class="loading-box">
        <div class="spinner"></div>
        <h2>Redirecionando...</h2>
        <p>Aguarde um instante, estamos abrindo sua página.</p>
    </div>
</body>
</html>

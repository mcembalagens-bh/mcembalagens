<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Auditoria de Estoque - MC Embalagens</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #f0f2f5; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; background: white; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); overflow: hidden; }
        .header { background: #1a3a5c; color: white; padding: 20px 30px; }
        .tabs { display: flex; background: #e2e8f0; border-bottom: 1px solid #cbd5e1; }
        .tab { padding: 15px 25px; cursor: pointer; font-weight: 600; color: #475569; border-bottom: 3px solid transparent; }
        .tab.active { background: white; color: #1a3a5c; border-bottom-color: #1a3a5c; }
        .content { padding: 30px; }
        .tab-pane { display: none; }
        .tab-pane.active { display: block; }
        
        /* BARRA DE PESQUISA */
        .search-bar { margin-bottom: 20px; display: flex; gap: 10px; align-items: center; background: #f8fafc; padding: 15px; border-radius: 8px; border: 1px solid #e2e8f0; }
        .search-bar input { flex: 1; padding: 12px 15px; border: 2px solid #cbd5e1; border-radius: 8px; font-size: 15px; outline: none; transition: 0.3s; }
        .search-bar input:focus { border-color: #1a3a5c; box-shadow: 0 0 0 3px rgba(26,58,92,0.1); }
        .search-bar button { padding: 12px 20px; background: #1a3a5c; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .search-bar button:hover { background: #2a5a8c; }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e2e8f0; vertical-align: top; }
        th { background: #f8fafc; color: #64748b; text-transform: uppercase; font-size: 12px; }
        
        .badge { padding: 4px 8px; border-radius: 12px; font-size: 11px; font-weight: 700; display: inline-block; }
        .badge-blue { background: #e0f2fe; color: #075985; }
        
        .diferenca-positiva { color: #166534; font-weight: bold; }
        .diferenca-negativa { color: #991b1b; font-weight: bold; }
        
        .alerta-erro { background: #fee2e2; color: #991b1b; padding: 15px; margin-bottom: 20px; display: none; border-radius: 8px; }
        .loading { text-align: center; padding: 40px; color: #64748b; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🕵️ Raio-X do Estoque - MC Embalagens</h1>
    </div>

    <div class="tabs">
        <div class="tab active" onclick="mudarAba('estoque')">📦 Histórico de Estoque</div>
        <div class="tab" onclick="mudarAba('pedidos')">🛍️ Pedidos (30 dias)</div>
    </div>

    <div class="content">
        <div id="erro" class="alerta-erro"></div>

        <div id="aba-estoque" class="tab-pane active">
            <div class="search-bar">
                <input type="text" id="filtroProduto" placeholder="🔍 Digite o nome ou código do produto para filtrar..." oninput="filtrarEstoque()">
                <button onclick="document.getElementById('filtroProduto').value=''; filtrarEstoque();">Limpar Filtro</button>
            </div>

            <div id="load-estoque" class="loading">Buscando histórico...</div>
            <table id="table-estoque" style="display:none;">
                <thead>
                    <tr>
                        <th>Data/Hora</th>
                        <th>Produto</th>
                        <th>Estoque Anterior</th>
                        <th>Estoque Novo</th>
                        <th>Diferença</th>
                        <th>Origem</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
            <div id="sem-resultado" style="display:none; text-align:center; padding:20px; color:#666;">Nenhuma movimentação encontrada para este filtro.</div>
        </div>

        <div id="aba-pedidos" class="tab-pane">
            <h3>Pedidos Recentes</h3>
            <div id="load-pedidos" class="loading">Buscando pedidos...</div>
            <table id="table-pedidos" style="display:none;">
                <thead>
                    <tr>
                        <th>Pedido</th>
                        <th>Data</th>
                        <th>Cliente</th>
                        <th>Itens</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const supabaseUrl = 'https://ddtiraoxbxexstozncwj.supabase.co';
    const supabaseKey = 'sb_publishable_JJBVWA5QR9N9WZTJ_PROcA_PaioDgKR';
    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

    // Variáveis globais para guardar os dados baixados
    let historicoOriginal = [];
    let pedidosOriginal = [];

    function mudarAba(aba) {
        document.querySelectorAll('.tab-pane').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById('aba-' + aba).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    function formatarData(dataStr) {
        if (!dataStr) return '-';
        return new Date(dataStr).toLocaleString('pt-BR');
    }

    async function carregarTudo() {
        try {
            // 1. Busca os Pedidos Recentes
            const resPed = await supabaseClient.from('pedidos').select('*').order('id_pedido', { ascending: false }).limit(50);
            pedidosOriginal = resPed.data || [];
            
            const tbodyPed = document.querySelector('#table-pedidos tbody');
            pedidosOriginal.forEach(p => {
                const itens = (p.itens || '').split('|').map(i => `<div>${i.trim()}</div>`).join('');
                tbodyPed.innerHTML += `
                    <tr>
                        <td><strong>#${p.id_pedido}</strong></td>
                        <td>${formatarData(p.data_pedido)}</td>
                        <td>${p.cliente_nome}</td>
                        <td style="font-size:12px">${itens}</td>
                    </tr>
                `;
            });
            document.getElementById('load-pedidos').style.display = 'none';
            document.getElementById('table-pedidos').style.display = 'table';

            // 2. Busca o Histórico de Estoque
            const resHist = await supabaseClient.from('historico_auditoria').select('*').order('data_alteracao', { ascending: false }).limit(200);
            historicoOriginal = resHist.data || [];

            renderizarTabelaEstoque(historicoOriginal);

        } catch (e) {
            document.getElementById('erro').textContent = 'Erro: ' + e.message;
            document.getElementById('erro').style.display = 'block';
            document.querySelectorAll('.loading').forEach(l => l.style.display = 'none');
        }
    }

    // Função que desenha a tabela na tela
    function renderizarTabelaEstoque(dados) {
        const tbodyHist = document.querySelector('#table-estoque tbody');
        const semResultado = document.getElementById('sem-resultado');
        tbodyHist.innerHTML = '';

        if (dados.length === 0) {
            document.getElementById('table-estoque').style.display = 'none';
            semResultado.style.display = 'block';
            return;
        }

        dados.forEach(h => {
            const antigo = parseInt(h.dados_antigos?.estoque_antigo) || 0;
            const novo = parseInt(h.dados_novos?.estoque_novo) || 0;
            const nome = h.dados_novos?.nome || h.dados_antigos?.nome || 'Desconhecido';
            const diff = novo - antigo;
            
            let sinal = diff > 0 ? '+' + diff : diff;
            let cor = diff > 0 ? 'diferenca-positiva' : 'diferenca-negativa';
            
            let origem = '<span class="badge badge-blue">Ajuste Manual / Gestor</span>';
            if(h.operacao === 'VENDA') origem = '<span class="badge" style="background:#fee2e2;color:#991b1b;">Venda no Site</span>';

            tbodyHist.innerHTML += `
                <tr>
                    <td>${formatarData(h.data_alteracao)}</td>
                    <td><strong>${nome}</strong></td>
                    <td>${antigo}</td>
                    <td>${novo}</td>
                    <td class="${cor}">${sinal}</td>
                    <td>${origem}</td>
                </tr>
            `;
        });

        document.getElementById('load-estoque').style.display = 'none';
        semResultado.style.display = 'none';
        document.getElementById('table-estoque').style.display = 'table';
    }

    // Função que roda toda vez que o cliente digita no input
    function filtrarEstoque() {
        const termo = document.getElementById('filtroProduto').value.toLowerCase().trim();
        
        if (!termo) {
            renderizarTabelaEstoque(historicoOriginal);
            return;
        }

        // Filtra comparando o nome do produto ou o ID
        const filtrados = historicoOriginal.filter(h => {
            const nome = String(h.dados_novos?.nome || h.dados_antigos?.nome || '').toLowerCase();
            const id = String(h.id_registro || '');
            return nome.includes(termo) || id.includes(termo);
        });

        renderizarTabelaEstoque(filtrados);
    }

    carregarTudo();
</script>
</body>
</html>
